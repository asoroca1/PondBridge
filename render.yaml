services:
  - type: web
    name: pondbridge-api
    env: node
    plan: starter
    region: oregon
    rootDir: .
    buildCommand: npm install
    startCommand: npm --workspace @pondbridge/api run start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "4000"
      - key: API_JSON_LIMIT
        value: 15mb
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: AUTH_PROVIDER
        sync: false
      - key: HYBRID_ALLOW_LEGACY_TOKENS
        value: "true"
      - key: FRONTEND_ORIGIN
        value: https://app.pondbridgealumni.com
      - key: FRONTEND_ORIGINS
        sync: false
      - key: PUBLIC_API_ORIGIN
        value: https://api.pondbridgealumni.com
      - key: APP_BASE_DOMAIN
        value: pondbridgealumni.com
      - key: TENANT_HOST_SUFFIXES
        value: pondbridgealumni.com
      - key: CORS_ALLOW_SUBDOMAIN_ORIGINS
        value: "true"
      - key: CUSTOM_DOMAIN_ALLOWLIST
        value: ""
      - key: TRUST_PROXY_HOPS
        value: "1"
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_DIRECTOR_COPILOT_MODEL
        value: gpt-5.6-luna
      - key: OPENAI_DIRECTOR_COPILOT_MAX_OUTPUT_TOKENS
        value: "900"
      - key: OPENAI_DIRECTOR_COPILOT_TIMEOUT_MS
        value: "30000"
      - key: OPENAI_EMAIL_AGENT_MODEL
        value: gpt-5.6-luna
      - key: OPENAI_EMAIL_AGENT_MAX_OUTPUT_TOKENS
        value: "1800"
      - key: OPENAI_EMAIL_AGENT_TIMEOUT_MS
        value: "30000"
      - key: EMAIL_AGENT_MONTHLY_BUDGET_USD
        value: "25"
      - key: OPENAI_SEARCH_MODEL
        value: gpt-5.6-luna
      - key: OPENAI_SEARCH_MAX_OUTPUT_TOKENS
        value: "500"
      - key: OPENAI_SEARCH_TIMEOUT_MS
        value: "20000"
      - key: AI_SEARCH_MONTHLY_BUDGET_USD
        value: "15"
      - key: OPENAI_PROFILE_IMPORT_MODEL
