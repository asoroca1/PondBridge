services:
  - type: web
    name: pondbridge-api
    env: node
    plan: starter
    region: oregon
    rootDir: .
    buildCommand: npm install
    startCommand: npm --workspace @pondbridge/api run start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "4000"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: FRONTEND_ORIGIN
        sync: false
      - key: FRONTEND_ORIGINS
        sync: false
      - key: APP_BASE_DOMAIN
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PRICE_TEST_ANNUAL
        sync: false
      - key: BILLING_TEST_PLAN_TENANTS
        sync: false
      - key: AUTH_TOKEN_MODE
        value: hybrid
      - key: AUTH_COOKIE_NAME
        value: pondbridge_auth
      - key: AUTH_COOKIE_DOMAIN
        sync: false
      - key: AUTH_COOKIE_SECURE
        value: "true"
      - key: AUTH_COOKIE_SAMESITE
        value: lax
      - key: CLERK_SUPER_ADMIN_EMAILS
        value: adensoroca@gmail.com
      - key: CLERK_WEBHOOK_SIGNING_SECRET
        sync: false
      - key: CLERK_SUPER_ADMIN_USER_IDS
        value: ""
      - key: R2_BUCKET_NAME
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_ENDPOINT
        sync: false
      - key: R2_REGION
        value: auto
      - key: R2_PUBLIC_BASE_URL
        sync: false
      - key: CLOUDFLARE_ACCOUNT_ID
        sync: false
      - key: CLOUDFLARE_API_TOKEN
        sync: false
      - key: CLOUDFLARE_ZONE_ID
        sync: false
      - key: CLOUDFLARE_PAGES_PROJECT_NAME
        sync: false
      - key: CLOUDFLARE_WEB_CNAME_TARGET
        sync: false
      - key: CLOUDFLARE_WEB_PROXIED
        value: "true"
      - key: CLOUDFLARE_TTL
        value: "1"
      - key: CLOUDFLARE_DOMAIN_READY_TIMEOUT_MS
        value: "25000"
      - key: CLOUDFLARE_DOMAIN_READY_POLL_MS
        value: "1200"
