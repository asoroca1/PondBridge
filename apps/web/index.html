<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="PondBridge — Camp network management for camps and organizations" />
    <!-- Neutral default; TenantContext rewrites this from the camp's brand. -->
    <meta name="theme-color" content="#404040" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="PondBridge" />
    <!-- Resolved per camp at the edge by functions/brand/[[route]].js. These must be
         correct in the served HTML: a favicon swapped in from React lands after the
         browser has already committed to an icon, and Safari never re-reads it. -->
    <link rel="icon" sizes="32x32" href="/brand/icon-32.png" />
    <link rel="icon" sizes="192x192" href="/brand/icon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/brand/icon-180.png" />
    <link rel="manifest" href="/brand/manifest.webmanifest" />
    <title>PondBridge</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      (function restoreDeepLinkFrom404() {
        var currentUrl = new URL(window.location.href);
        var forwardedPath = currentUrl.searchParams.get("__pb_path");
        if (!forwardedPath) return;

        currentUrl.searchParams.delete("__pb_path");
        var cleaned = currentUrl.pathname + (currentUrl.search || "") + (currentUrl.hash || "");

        if (!/^\/(?!\/)/.test(forwardedPath)) {
          window.history.replaceState(null, "", cleaned);
          return;
        }

        window.history.replaceState(null, "", forwardedPath);
      })();
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
