<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="PondBridge — Alumni network management for camps and organizations" />
    <meta name="theme-color" content="#002b5c" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <title>PondBridge</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      (function restoreDeepLinkFrom404() {
        var currentUrl = new URL(window.location.href);
        var forwardedPath = currentUrl.searchParams.get("__pb_path");
        if (!forwardedPath) return;

        currentUrl.searchParams.delete("__pb_path");
        var cleaned = currentUrl.pathname + (currentUrl.search || "") + (currentUrl.hash || "");

        if (!/^\/(?!\/)/.test(forwardedPath)) {
          window.history.replaceState(null, "", cleaned);
          return;
        }

        window.history.replaceState(null, "", forwardedPath);
      })();
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
