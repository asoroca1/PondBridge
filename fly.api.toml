app = "pondbridge-api"
primary_region = "ord"

[build]
  dockerfile = "Dockerfile.api"

[env]
  NODE_ENV = "production"
  PORT = "4000"
  AUTH_TOKEN_MODE = "hybrid"
  AUTH_COOKIE_NAME = "pondbridge_auth"
  AUTH_COOKIE_SECURE = "true"
  AUTH_COOKIE_SAMESITE = "lax"

[[services]]
  protocol = "tcp"
  internal_port = 4000
  processes = ["app"]

  [[services.ports]]
    port = 80
    handlers = ["http"]

  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]

  [[services.http_checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "30s"
    method = "get"
    path = "/health"
    protocol = "http"
